<style>
  :root{
    --felt:#12302A;
    --felt-deep:#0C1F1B;
    --felt-line:#22453D;
    --bone:#EFE9DC;
    --bone-dim:#C9C2B4;
    --muted:#8AA69C;
    --faint:#5F7A72;
    --chip-red:#C8452F;
    --gold:#D9A441;
    --up:#E8C04A;
    --down:#E08A78;
    --ok:#6FD39D;
    --warn:#F2CF61;
    --bad:#F09A86;
    --radius:14px;
    --pad:18px;
    --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body:"Instrument Sans", system-ui, -apple-system, sans-serif;
    --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #17392F 0%, var(--felt) 45%, var(--felt-deep) 100%) fixed;
    background-color:var(--felt-deep);
    color:var(--bone);
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) 14px calc(110px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto}
  a{color:inherit}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:24px 2px 14px}
  .eyebrow{
    display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin:0 0 4px;text-decoration:none;
  }
  a.eyebrow:hover{color:var(--bone)}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:.98;letter-spacing:-.02em;margin:0;word-break:break-word}
  .ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    background:none;border:1px solid var(--felt-line);color:var(--bone-dim);
    font-family:var(--body);font-size:13px;font-weight:500;
    padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .ghost:hover{border-color:var(--muted);color:var(--bone)}
  .ghost.danger{color:var(--bad);border-color:rgba(224,138,120,.35)}

  .banner{
    font-size:12.5px;line-height:1.45;color:var(--bone-dim);
    border:1px dashed var(--felt-line);border-radius:12px;padding:9px 12px;margin:0 0 12px;
  }
  .banner b{color:var(--bone)}
  .banner.err{border-style:solid;border-color:rgba(224,138,120,.5);color:#F5C9BE;background:rgba(200,69,47,.12)}

  /* ---------- generic ---------- */
  .card{
    background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:var(--radius);
    padding:15px var(--pad);
  }
  .card h3{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0 0 3px}
  .card p{margin:0;color:var(--bone-dim);font-size:14px}
  .card .ghost{margin-top:12px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:24px 4px 8px}
  .sec-head h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
  .sec-head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .hint{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.45}
  .hint strong{color:var(--bone-dim);font-weight:600}
  .loading{color:var(--muted);font-size:14px;padding:30px 4px}
  .hidden{display:none !important}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

  /* ---------- lists of names ---------- */
  .list{display:flex;flex-direction:column;gap:8px}
  .prow{
    display:flex;align-items:center;gap:12px;text-decoration:none;
    background:rgba(239,233,220,.045);border:1px solid var(--felt-line);border-radius:var(--radius);
    padding:13px var(--pad);cursor:pointer;
  }
  .prow:hover,.prow:focus-visible{border-color:var(--muted)}
  .prow.me{border-color:rgba(217,164,65,.55)}
  .p-main{flex:1;min-width:0}
  .p-name{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
  .p-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .p-pl{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .p-pl small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:1px}
  .tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
    color:var(--gold);border:1px solid rgba(217,164,65,.4);border-radius:6px;padding:2px 6px;
  }
  .tag.you{color:var(--bone-dim);border-color:var(--felt-line)}
  .chev{color:var(--faint);font-size:20px;line-height:1}
  .add{
    width:100%;background:none;border:1px dashed var(--felt-line);color:var(--bone-dim);
    font-family:var(--body);font-size:15px;padding:13px;border-radius:var(--radius);cursor:pointer;margin-top:8px;
  }
  .add:hover{border-color:var(--muted);color:var(--bone)}
  .addrow{
    display:flex;gap:8px;align-items:center;margin-top:8px;
    background:rgba(0,0,0,.28);border:1px solid var(--gold);border-radius:var(--radius);padding:8px 8px 8px 14px;
  }
  .addrow input{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:18px}
  .pill{
    flex:none;border:none;border-radius:10px;cursor:pointer;background:var(--gold);color:#231803;
    font-family:var(--display);font-weight:700;font-size:15px;padding:10px 16px;
  }
  .foot-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

  input,select{font-family:var(--body);color:var(--bone);background:none;border:none;font-size:16px;width:100%;padding:0}
  input:focus,select:focus{outline:none}
  input::placeholder{color:var(--faint)}

  /* ---------- entry ---------- */
  .lifeline{font-size:14px;color:var(--bone-dim);margin:-4px 2px 16px}
  .lifeline b{font-family:var(--mono);font-weight:500}
  .field{display:block;margin-bottom:14px}
  .f-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .f-box{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border:1px solid var(--felt-line);border-radius:11px;padding:12px 12px}
  .f-box:focus-within{border-color:var(--gold)}
  .cur{font-family:var(--mono);color:var(--muted);font-size:20px}
  .f-box input{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
  .rebuys{display:flex;gap:6px;margin-top:8px}
  .rebuy{
    background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.3);color:var(--gold);
    font-family:var(--mono);font-size:13px;border-radius:8px;padding:7px 11px;cursor:pointer;
  }
  .rebuy:hover{background:rgba(217,164,65,.2)}
  .netline{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--felt-line);padding-top:12px;margin-top:4px}
  .netline .f-label{margin:0}
  .netline .mono{font-size:18px}
  .errmsg{color:var(--bad);font-size:13.5px;margin:10px 2px 0;min-height:1px}

  /* ---------- ledger ---------- */
  .ledger-figs{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .fig{display:flex;flex-direction:column;gap:2px}
  .fig .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .fig .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  .fig.right{text-align:right}
  .track{position:relative;height:9px;border-radius:999px;margin:13px 0 10px;background:rgba(0,0,0,.35);border:1px solid var(--felt-line);overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;background:linear-gradient(90deg,#2F6D5C,#4FA98C);transition:width .35s cubic-bezier(.2,.7,.2,1)}
  .track.green .fill{background:linear-gradient(90deg,#2F8A62,var(--ok))}
  .track.yellow .fill{background:linear-gradient(90deg,#9C7A22,var(--warn))}
  .track.red .fill{background:linear-gradient(90deg,#8E3B2A,var(--chip-red))}
  .ledger-note{font-size:13.5px;color:var(--bone-dim)}

  /* ---------- table rows ---------- */
  .trow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--felt-line);padding:12px 4px;text-decoration:none}
  .trow:last-child{border-bottom:1px solid var(--felt-line)}
  .trow .p-name{font-size:17px}
  .tsub{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--bone-dim);margin-top:3px}
  .tsub small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:4px}
  .tsub .sep{color:var(--faint);margin:0 7px}
  .tnet{flex:none;text-align:right;font-size:16px}
  .tnet .settles{display:block;font-size:10.5px;color:var(--muted)}
  .playing{color:var(--faint);font-style:italic;font-family:var(--body)}

  /* ---------- verdict ---------- */
  .verdict{border-radius:var(--radius);padding:14px 16px;border:1px solid;margin:18px 0 0}
  .verdict h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .verdict h3::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(255,255,255,.06)}
  .verdict p{margin:0;font-size:13.5px;color:var(--bone-dim)}
  .verdict p b{font-family:var(--mono);font-weight:500;color:var(--bone)}
  .verdict.green{background:rgba(111,211,157,.10);border-color:rgba(111,211,157,.45)} .verdict.green h3{color:var(--ok)}
  .verdict.yellow{background:rgba(242,207,97,.10);border-color:rgba(242,207,97,.45)} .verdict.yellow h3{color:var(--warn)}
  .verdict.red{background:rgba(200,69,47,.15);border-color:rgba(240,154,134,.5)} .verdict.red h3{color:var(--bad)}

  /* ---------- you card + payments ---------- */
  .youcard{margin-top:12px}
  .you-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .you-head .f-label{margin:0}
  .youcard select{
    width:auto;max-width:60%;font-family:var(--display);font-weight:600;font-size:16px;color:var(--bone);
    background:rgba(0,0,0,.28);border:1px solid var(--felt-line);border-radius:9px;padding:6px 10px;
  }
  .youcard select option{color:#111}
  .yline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;font-size:16px}
  .yline .mono{font-size:17px}
  .yline.owe .mono{color:var(--down)} .yline.get .mono{color:var(--up)}
  .ysum{font-size:13px;color:var(--muted);border-top:1px dashed var(--felt-line);margin-top:6px;padding-top:9px}
  .pay{display:flex;align-items:center;gap:12px;border-top:1px solid var(--felt-line);padding:13px 4px}
  .pay:last-child{border-bottom:1px solid var(--felt-line)}
  .pay-who{flex:1;min-width:0;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
  .pay-who .arw{color:var(--gold);margin:0 7px;font-family:var(--body);font-weight:400}
  .pay-amt{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .even{text-align:center;padding:22px 10px;color:var(--bone-dim);border:1px dashed var(--felt-line);border-radius:var(--radius)}

  /* ---------- history ---------- */
  details.night{background:rgba(239,233,220,.045);border:1px solid var(--felt-line);border-radius:var(--radius);margin-bottom:8px}
  details.night[open]{border-color:var(--muted)}
  details.night summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px var(--pad);cursor:pointer}
  details.night summary::-webkit-details-marker{display:none}
  .dot{flex:none;width:9px;height:9px;border-radius:50%}
  .dot.green{background:var(--ok)} .dot.yellow{background:var(--warn)} .dot.red{background:var(--bad)}
  .night-body{padding:0 var(--pad) 14px}
  .hrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--felt-line);font-size:15px}
  .hrow:first-child{border-top:none}

  /* ---------- bottom bar ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--felt-deep) 62%,rgba(12,31,27,0));z-index:5}
  .bar-row{display:flex;gap:8px}
  .primary{
    flex:1;border:none;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;
    font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em;
    padding:16px;background:var(--gold);color:#231803;
  }
  .primary:disabled{background:#274841;color:#658279;cursor:not-allowed}
  .secondary{
    flex:none;border:1px solid var(--felt-line);border-radius:12px;cursor:pointer;background:rgba(12,31,27,.9);color:var(--bone);
    font-family:var(--display);font-weight:600;font-size:16px;padding:16px 18px;
  }
  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--bone);color:#14231F;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;
    transition:opacity .2s, transform .2s;z-index:10;max-width:calc(100% - 40px);text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{padding:34px 4px 10px;color:var(--faint);font-size:12px;font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<script type="module">
/* =====================================================================
   FIREBASE CONFIG
   Paste the config object from Firebase (Project settings > Your apps)
   in place of null. Leave it null to run in demo mode, where data is
   saved on this one device only.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC-Y8mNXDtEl4SS4wWJKte5B7DK9N3XkGs",
  authDomain: "settle-up-17ce1.firebaseapp.com",
  projectId: "settle-up-17ce1",
  storageBucket: "settle-up-17ce1.firebasestorage.app",
  messagingSenderId: "453274251483",
  appId: "1:453274251483:web:9e020c195cacba8ffb5cfe"
};
const FIREBASE_SDK = "12.19.0";

/*UTIL-START*/
function uid(){
  const a = "abcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  const r = (globalThis.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(12)) : null;
  for (let i = 0; i < 12; i++) s += a[(r ? r[i] : Math.floor(Math.random()*256)) % a.length];
  return s;
}
function slugify(name){
  const s = String(name).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24);
  return s || "group";
}
/*UTIL-END*/

/* ---------- money ---------- */
const money = c => (c < 0 ? "-" : "") + "$" + (Math.abs(c)/100).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const signed = c => (c > 0 ? "+" : "") + money(c);
const tone = c => c > 0 ? "up" : (c < 0 ? "down" : "flat");
const plain = c => (Math.abs(c)/100).toFixed(2);
function parseMoney(str){
  if (str === undefined || str === null) return null;
  const s = String(str).replace(/[^0-9.]/g, "");
  if (s === "" || s === ".") return null;
  const v = Number(s);
  return isFinite(v) ? Math.round(v*100) : null;
}
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const byName = (a, b) => a.name.localeCompare(b.name, undefined, {sensitivity:"base"});

/*SETTLE-START*/
/* Split `total` cents across positive integer `weights` in proportion,
   exact to the cent (largest-remainder method). */
function allocate(total, weights){
  const W = weights.reduce((a, b) => a + b, 0);
  if (W <= 0 || total <= 0) return weights.map(() => 0);
  const out = weights.map(w => Math.floor((w * total) / W));
  const rems = weights.map((w, i) => [(w * total) % W, i]);
  const left = total - out.reduce((a, b) => a + b, 0);
  rems.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; k < left; k++) out[rems[k][1]]++;
  return out;
}
/* list: [{pid, name, buyIn, cashOut}] in cents.
   Cash-outs over buy-ins  -> winners are trimmed pro rata to what losers lost   (yellow)
   Cash-outs under buy-ins -> losers are trimmed pro rata to what winners won    (red)
   Every phone computes the identical answer: rows are ordered by player id. */
function settle(list){
  const rows = list.map(e => ({pid: e.pid, name: e.name, buyIn: e.buyIn, cashOut: e.cashOut, net: e.cashOut - e.buyIn}))
                   .sort((a, b) => (a.pid < b.pid ? -1 : a.pid > b.pid ? 1 : 0));
  let totalIn = 0, totalOut = 0, won = 0, lost = 0;
  rows.forEach(r => { totalIn += r.buyIn; totalOut += r.cashOut; if (r.net > 0) won += r.net; else lost -= r.net; r.settled = r.net; });
  const diff = totalOut - totalIn;
  const winners = rows.filter(r => r.net > 0), losers = rows.filter(r => r.net < 0);
  let status = "perfect";
  if (diff > 0){
    status = "winnersShort";
    const a = allocate(lost, winners.map(r => r.net));
    winners.forEach((r, i) => r.settled = a[i]);
  } else if (diff < 0){
    status = "losersOver";
    const a = allocate(won, losers.map(r => -r.net));
    losers.forEach((r, i) => r.settled = -a[i]);
  }
  const cmp = (a, b) => b.amt - a.amt || (a.pid < b.pid ? -1 : a.pid > b.pid ? 1 : 0);
  const cred = rows.filter(r => r.settled > 0).map(r => ({pid: r.pid, amt: r.settled})).sort(cmp);
  const deb  = rows.filter(r => r.settled < 0).map(r => ({pid: r.pid, amt: -r.settled})).sort(cmp);
  const transfers = [];
  let i = 0, j = 0;
  while (i < deb.length && j < cred.length){
    const a = Math.min(deb[i].amt, cred[j].amt);
    if (a > 0) transfers.push({from: deb[i].pid, to: cred[j].pid, amount: a});
    deb[i].amt -= a; cred[j].amt -= a;
    if (deb[i].amt === 0) i++;
    if (cred[j].amt === 0) j++;
  }
  return {status, diff, totalIn, totalOut, rows, transfers};
}
/*SETTLE-END*/

/* =====================================================================
   STORAGE. Both stores expose the same calls.
   Data shape:
     groups/{gid}                 {name, createdAt, activeSessionId}
     groups/{gid}/players/{pid}   {name, createdAt}
     groups/{gid}/sessions/{sid}  {status:"open"|"finished", createdAt, finishedAt,
                                   entries:{pid:{buyIn, cashOut, at}}, result}
   All-time P/L is each finished night's numbers exactly as entered
   (cash-out minus buy-in), even when the pot was off and payments were
   trimmed. It is never stored as a running total; it is summed from
   finished nights, so deleting a bad night fixes everyone's totals.
   ===================================================================== */

/*FS-START*/
function makeFirestoreStore(fb, db){
  const {doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, runTransaction, deleteField} = fb;
  const gRef = gid => doc(db, "groups", gid);
  const pCol = gid => collection(db, "groups", gid, "players");
  const sCol = gid => collection(db, "groups", gid, "sessions");
  const sRef = (gid, sid) => doc(db, "groups", gid, "sessions", sid);
  const rows = q => q.docs.map(d => ({id: d.id, ...d.data()}));
  return {
    mode: "cloud",
    watchGroups(cb, onErr){
      return onSnapshot(collection(db, "groups"), q => cb(rows(q)), onErr);
    },
    watchGroup(gid, cb, onErr){
      let g, ps, ss, a = false, b = false, c = false;
      const fire = () => { if (a && b && c) cb({group: g, players: ps, sessions: ss}); };
      const u1 = onSnapshot(gRef(gid), d => { g = d.exists() ? {id: d.id, ...d.data()} : null; a = true; fire(); }, onErr);
      const u2 = onSnapshot(pCol(gid), q => { ps = rows(q); b = true; fire(); }, onErr);
      const u3 = onSnapshot(sCol(gid), q => { ss = rows(q); c = true; fire(); }, onErr);
      return () => { u1(); u2(); u3(); };
    },
    async createGroup(name){
      const base = slugify(name);
      for (let n = 1; n < 60; n++){
        const id = n === 1 ? base : base + "-" + n;
        const made = await runTransaction(db, async tx => {
          const s = await tx.get(gRef(id));
          if (s.exists()) return false;
          tx.set(gRef(id), {name, createdAt: Date.now(), activeSessionId: null});
          return true;
        });
        if (made) return id;
      }
      throw new Error("Couldn't create that group.");
    },
    async addPlayer(gid, name){
      const id = uid();
      await setDoc(doc(pCol(gid), id), {name, createdAt: Date.now()});
      return id;
    },
    async saveEntry(gid, pid, entry){
      const sid = await runTransaction(db, async tx => {
        const g = await tx.get(gRef(gid));
        if (!g.exists()) throw new Error("This group doesn't exist anymore.");
        const cur = g.data().activeSessionId;
        if (cur) return cur;
        const nid = uid();
        tx.set(sRef(gid, nid), {status: "open", createdAt: Date.now(), entries: {}});
        tx.update(gRef(gid), {activeSessionId: nid});
        return nid;
      });
      await updateDoc(sRef(gid, sid), {["entries." + pid]: entry});
      return sid;
    },
    async removeEntry(gid, sid, pid){
      await updateDoc(sRef(gid, sid), {["entries." + pid]: deleteField()});
    },
    async clearCashOuts(gid, sid, pids){
      if (!pids.length) return;
      const patch = {};
      pids.forEach(p => { patch["entries." + p + ".cashOut"] = null; });
      await updateDoc(sRef(gid, sid), patch);
    },
    finishSession(gid, sid, result){
      return runTransaction(db, async tx => {
        const g = await tx.get(gRef(gid));
        const s = await tx.get(sRef(gid, sid));
        if (!s.exists() || s.data().status !== "open") return false;
        tx.update(sRef(gid, sid), {status: "finished", finishedAt: Date.now(), result});
        if (g.exists() && g.data().activeSessionId === sid) tx.update(gRef(gid), {activeSessionId: null});
        return true;
      });
    },
    async deleteSession(gid, sid){
      await deleteDoc(sRef(gid, sid));
    }
  };
}
/*FS-END*/

function makeLocalStore(){
  const KEY = "settleup.demo.v2";
  let mem = null;
  const read = () => {
    try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
    return mem || {groups: {}};
  };
  let data = read();
  const subs = new Set();
  const emit = () => subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  const commit = () => {
    mem = data;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    setTimeout(emit, 0);
  };
  window.addEventListener("storage", e => { if (e.key === KEY){ data = read(); emit(); } });
  const clone = o => JSON.parse(JSON.stringify(o));
  const G = gid => { const g = data.groups[gid]; if (!g) throw new Error("This group doesn't exist anymore."); return g; };
  return {
    mode: "demo",
    watchGroups(cb){
      const fn = () => cb(Object.entries(data.groups).map(([id, g]) => ({id, name: g.name, createdAt: g.createdAt})));
      subs.add(fn); setTimeout(fn, 0);
      return () => subs.delete(fn);
    },
    watchGroup(gid, cb){
      const fn = () => {
        const g = data.groups[gid];
        if (!g) return cb({group: null, players: [], sessions: []});
        cb(clone({
          group: {id: gid, name: g.name, activeSessionId: g.activeSessionId || null},
          players: Object.entries(g.players || {}).map(([id, p]) => ({id, ...p})),
          sessions: Object.entries(g.sessions || {}).map(([id, s]) => ({id, ...s}))
        }));
      };
      subs.add(fn); setTimeout(fn, 0);
      return () => subs.delete(fn);
    },
    async createGroup(name){
      data = read();
      const base = slugify(name);
      let id = base, n = 1;
      while (data.groups[id]) id = base + "-" + (++n);
      data.groups[id] = {name, createdAt: Date.now(), activeSessionId: null, players: {}, sessions: {}};
      commit(); return id;
    },
    async addPlayer(gid, name){
      data = read();
      const id = uid();
      G(gid).players[id] = {name, createdAt: Date.now()};
      commit(); return id;
    },
    async saveEntry(gid, pid, entry){
      data = read();
      const g = G(gid);
      let sid = g.activeSessionId;
      if (!sid || !g.sessions[sid] || g.sessions[sid].status !== "open"){
        sid = uid();
        g.sessions[sid] = {status: "open", createdAt: Date.now(), entries: {}};
        g.activeSessionId = sid;
      }
      g.sessions[sid].entries[pid] = entry;
      commit(); return sid;
    },
    async removeEntry(gid, sid, pid){
      data = read();
      const s = G(gid).sessions[sid];
      if (s && s.entries) delete s.entries[pid];
      commit();
    },
    async clearCashOuts(gid, sid, pids){
      data = read();
      const s = G(gid).sessions[sid];
      if (s) pids.forEach(p => { if (s.entries[p]) s.entries[p].cashOut = null; });
      commit();
    },
    async finishSession(gid, sid, result){
      data = read();
      const g = G(gid), s = g.sessions[sid];
      if (!s || s.status !== "open") return false;
      s.status = "finished"; s.finishedAt = Date.now(); s.result = result;
      if (g.activeSessionId === sid) g.activeSessionId = null;
      commit(); return true;
    },
    async deleteSession(gid, sid){
      data = read();
      delete G(gid).sessions[sid];
      commit();
    }
  };
}

async function initStore(){
  if (!FIREBASE_CONFIG) return makeLocalStore();
  const base = "https://www.gstatic.com/firebasejs/" + FIREBASE_SDK + "/";
  const appMod = await import(base + "firebase-app.js");
  const fsMod = await import(base + "firebase-firestore.js");
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  return makeFirestoreStore(fsMod, fsMod.getFirestore(app));
}

function copyText(text){
  const ok = () => toast("Link copied");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { window.prompt("Copy this link:", text); }
    ta.remove();
  }
}

function fmtDate(ms){
  const d = new Date(ms), now = new Date();
  const opts = {weekday: "short", month: "short", day: "numeric"};
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
function fmtTime(ms){ return new Date(ms).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"}); }

/* ---- derived group data ---- */
function derive(){
  const pmap = {};
  S.players.forEach(p => { pmap[p.id] = p; });
  const active = S.group && S.group.activeSessionId
    ? S.sessions.find(s => s.id === S.group.activeSessionId && s.status === "open") || null : null;
  const finished = S.sessions.filter(s => s.status === "finished" && s.result)
                             .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  const life = {};
  finished.forEach(s => {
    Object.entries(s.result.players || {}).forEach(([pid, r]) => {
      const L = life[pid] || (life[pid] = {pl: 0, nights: 0});
      L.pl += r.net; L.nights++;
    });
  });
  const entries = active
    ? Object.entries(active.entries || {})
        .filter(([, e]) => e && typeof e.buyIn === "number")
        .map(([pid, e]) => ({pid, name: (pmap[pid] || {}).name || "Unknown", buyIn: e.buyIn,
                             cashOut: typeof e.cashOut === "number" ? e.cashOut : null}))
        .sort(byName)
    : [];
  return {pmap, active, finished, life, entries};
}
function recordedToResult(s){
  const r = s.result;
  const rows = Object.entries(r.players || {}).map(([pid, p]) => ({pid, ...p}));
  return {status: r.status, diff: r.diff, totalIn: r.totalIn, totalOut: r.totalOut, rows, transfers: r.transfers || []};
}
const nightsLabel = n => n === 0 ? "No nights yet" : (n === 1 ? "1 night" : n + " nights");

/* ---- verdict + payouts (shared by live table and recorded nights) ---- */
const VERDICT = {
  perfect:      {cls: "green",  head: "Payouts are perfect"},
  winnersShort: {cls: "yellow", head: "Winners are receiving less profit"},
  losersOver:   {cls: "red",    head: "Losers owe more than they should"}
};
function verdictHTML(res){
  const v = VERDICT[res.status];
  let detail;
  if (res.status === "perfect"){
    detail = "Buy-ins and cash-outs match to the penny: <b>" + money(res.totalIn) + "</b>.";
  } else if (res.status === "winnersShort"){
    detail = "Cash-outs are <b>" + money(res.diff) + "</b> more than the buy-ins. Winners are paid out of what the losers actually lost, split in proportion to each winner's profit. All-time numbers still log what each person entered.";
  } else {
    detail = "Cash-outs are <b>" + money(-res.diff) + "</b> less than the buy-ins. Losers only pay what the winners actually won, split in proportion to each loser's loss. All-time numbers still log what each person entered.";
  }
  return '<section class="verdict ' + v.cls + '"><h3>' + v.head + '</h3><p>' + detail + '</p></section>';
}
function payoutsHTML(res, names, forPid, selectId){
  const rows = res.rows.slice().sort(byName);
  let html = "";
  if (selectId){
    const opts = ['<option value="">Pick your name</option>']
      .concat(rows.map(r => '<option value="' + esc(r.pid) + '"' + (r.pid === forPid ? " selected" : "") + '>' + esc(r.name) + '</option>'))
      .join("");
    html += '<section class="card youcard"><div class="you-head"><span class="f-label">Showing for</span><select id="' + selectId + '" aria-label="Whose payouts to show">' + opts + '</select></div>';
    const me = rows.find(r => r.pid === forPid);
    if (me){
      const mine = res.transfers.filter(t => t.from === forPid || t.to === forPid);
      if (!mine.length) html += '<div class="yline"><span>You\'re square tonight. Nobody owes you and you owe nobody.</span></div>';
      mine.forEach(t => {
        html += t.from === forPid
          ? '<div class="yline owe"><span>You pay <b>' + esc(names(t.to)) + '</b></span><span class="mono">' + money(t.amount) + '</span></div>'
          : '<div class="yline get"><span><b>' + esc(names(t.from)) + '</b> pays you</span><span class="mono">' + money(t.amount) + '</span></div>';
      });
      html += '<div class="ysum">Logged for you tonight: <b class="mono ' + tone(me.net) + '">' + signed(me.net) + '</b>.'
            + (me.settled !== me.net ? ' Your payment above is ' + money(Math.abs(me.net - me.settled)) + ' different because the pot is off.' : '') + '</div>';
    } else {
      html += '<div class="yline"><span class="flat">Pick your name to see what you owe or are owed.</span></div>';
    }
    html += '</section>';
  }
  html += '<div class="sec-head"><h2>Who pays who</h2></div>';
  if (!res.transfers.length){
    html += '<p class="even">Everybody broke even. Nobody owes anybody.</p>';
  } else {
    html += '<div>' + res.transfers.map(t =>
      '<div class="pay"><div class="pay-who">' + esc(names(t.from)) + '<span class="arw">&rarr;</span>' + esc(names(t.to)) +
      '</div><div class="pay-amt">' + money(t.amount) + '</div></div>').join("") + '</div>';
  }
  return html;
}

    };
    buy.addEventListener("keydown", e => { if (e.key === "Enter") cash.focus(); });
    cash.addEventListener("keydown", e => { if (e.key === "Enter") $("#save").click(); });
    window._showNet = showNet;
  };
  return {
    update(){
      if (!S.loaded) return;
      if (!S.group){ view.innerHTML = missingGroupHTML(gid); setBar(null); return; }
      const player = S.players.find(p => p.id === pid);
      if (!player){
        setHeader({crumb: "‹ " + S.group.name, href: gHash, title: "Not found"});
        view.innerHTML = '<p class="hint">That player isn\'t in this group.</p>'; setBar(null); return;
      }
      if (!built) build(player);
      const d = derive();
      const L = d.life[pid] || {pl: 0, nights: 0};
      const e = d.entries.find(x => x.pid === pid);
      const k = JSON.stringify([L, !!e]);
      if (k !== lifeKey){
        lifeKey = k;
        $("#life").innerHTML = L.nights
          ? 'All-time: <b class="' + tone(L.pl) + '">' + signed(L.pl) + '</b> over ' + nightsLabel(L.nights)
          : 'First night. Good luck.';
        $("#leave").classList.toggle("hidden", !e);
      }
      if (!filled){
        filled = true;
        if (e){
          $("#buy").value = plain(e.buyIn);
          if (e.cashOut !== null) $("#cash").value = plain(e.cashOut);
          window._showNet();
        } else {
          setTimeout(() => { const b = $("#buy"); if (b && !b.value) b.focus(); }, 50);
        }
      }
    }
  };
}

function TableScreen(gid){
  let key = "", headerSet = false;
  const gHash = "#/" + encodeURIComponent(gid);
  return {
    update(){
      if (!S.loaded) return;
      if (!S.group){ view.innerHTML = missingGroupHTML(gid); setBar(null); return; }
      if (!headerSet){ headerSet = true; setHeader({crumb: "‹ " + S.group.name, href: gHash, title: "Tonight"}); }
      const d = derive();
      const me = getMe(gid);
      const k = JSON.stringify([d.active && d.active.id, d.entries, me, d.finished[0] && d.finished[0].id, S.players]);
      if (k === key) return; key = k;
      const names = pid => (d.pmap[pid] || {}).name || "Unknown";

      /* no game running: show the last recorded night so everyone still sees who owes who */
      if (!d.active){
        const last = d.finished[0];
        let html = '<section class="card"><h3>No game running</h3><p>Tap your name on the group page to buy in and start one.</p>' +
                   '<a class="ghost" href="' + gHash + '">Pick your name &rsaquo;</a></section>';
        if (last){
          const res = recordedToResult(last);
          const nm = pid => ((last.result.players || {})[pid] || {}).name || names(pid);
          html += '<div class="sec-head"><h2>Last game · ' + fmtDate(last.finishedAt) + ', ' + fmtTime(last.finishedAt) + '</h2><span class="sub">Recorded</span></div>' +
                  verdictHTML(res) + payoutsHTML(res, nm, me, "forSel");
        }
        view.innerHTML = html;
        bindFor();
        setBar(null);
        return;
      }

      const ents = d.entries;
      const tin = ents.reduce((a, e) => a + e.buyIn, 0);
      const tout = ents.reduce((a, e) => a + (e.cashOut || 0), 0);
      const waiting = ents.filter(e => e.cashOut === null);
      const ready = ents.length >= 2 && !waiting.length;
      const res = ready ? settle(ents) : null;
      const settledBy = {};
      if (res) res.rows.forEach(r => { settledBy[r.pid] = r; });
      const cls = res ? VERDICT[res.status].cls : "";
      const pct = tin > 0 ? Math.min(100, (tout / tin) * 100) : 0;

      let note;
      if (!ents.length) note = "Nobody has bought in yet.";
      else if (ents.length < 2) note = "Waiting for at least one more player.";
      else if (waiting.length) note = "Waiting on " + waiting.length + " cash-out" + (waiting.length > 1 ? "s" : "") + ": " + waiting.map(w => esc(w.name)).join(", ") + ".";
      else note = "Everyone's in. Results below.";

      let html =
        '<section class="card"><div class="ledger-figs">' +
          '<div class="fig"><span class="k">In the pot</span><span class="v">' + money(tin) + '</span></div>' +
          '<div class="fig right"><span class="k">Cashed out</span><span class="v">' + money(tout) + '</span></div></div>' +
          '<div class="track ' + cls + '"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '<p class="ledger-note">' + note + '</p></section>' +
        '<div class="sec-head"><h2>At the table</h2><span class="sub">Tap a name to edit</span></div><div>';
      html += ents.map(e => {
        const r = settledBy[e.pid];
        const net = e.cashOut === null ? null : e.cashOut - e.buyIn;
        return '<a class="trow" href="' + gHash + '/p/' + e.pid + '"><div class="p-main"><div class="p-name">' + esc(e.name) +
          (e.pid === me ? '<span class="tag you">You</span>' : '') + '</div>' +
          '<div class="tsub"><small>In</small>' + money(e.buyIn) + '<span class="sep">·</span><small>Out</small>' +
            (e.cashOut === null ? '<span class="playing">playing</span>' : money(e.cashOut)) + '</div></div>' +
          '<div class="tnet mono ' + (net === null ? "flat" : tone(net)) + '">' + (net === null ? "—" : signed(net)) +
            (r && r.settled !== r.net ? '<span class="settles">' + (r.settled >= 0 ? "gets " : "pays ") + money(Math.abs(r.settled)) + '</span>' : '') + '</div></a>';
      }).join("");
      html += '</div>';
      if (res) html += verdictHTML(res) + payoutsHTML(res, names, me, "forSel");
      view.innerHTML = html;
      bindFor();

      if (res){
        setBar('<div class="bar-row"><button class="secondary" id="recalc" type="button">Recalculate</button><button class="primary" id="finish" type="button">Finish</button></div>');
        $("#recalc").onclick = async () => {
          if (!confirm("Clear everyone's cash-out so you can recount? Buy-ins stay, and everyone re-enters their cash-out.")) return;
          await run(() => S.store.clearCashOuts(gid, d.active.id, ents.map(e => e.pid)));
          toast("Cash-outs cleared. Recount and re-enter.");
        };
        $("#finish").onclick = async () => {
          const fresh = derive();
          if (!fresh.active || fresh.active.id !== d.active.id){ toast("Someone already finished tonight."); return; }
          const r2 = settle(fresh.entries);
          const gap = Math.abs(r2.diff);
          const ask = gap >= 100
            ? "Pot is off by " + money(gap) + ". Finish anyway?\n\nEveryone's numbers get logged exactly as entered, so a big gap stays in the all-time totals unless you delete the night in History."
            : "Record tonight? These results get added to everyone's all-time numbers.";
          if (!confirm(ask)) return;
          const players = {};
          r2.rows.forEach(r => { players[r.pid] = {name: r.name, buyIn: r.buyIn, cashOut: r.cashOut, net: r.net, settled: r.settled}; });
          const result = {status: r2.status, diff: r2.diff, totalIn: r2.totalIn, totalOut: r2.totalOut, players, transfers: r2.transfers};
          $("#finish").disabled = true;
          const ok = await run(() => S.store.finishSession(gid, fresh.active.id, result));
          if (ok === false) toast("Someone already finished tonight.");
          else if (ok){ toast("Recorded. All-time numbers updated."); location.hash = gHash; }
          else if ($("#finish")) $("#finish").disabled = false;
        };
      } else {
        const meIn = me && ents.find(e => e.pid === me);
        setBar('<div class="bar-row"><a class="primary" href="' + gHash + (meIn ? "/p/" + me : "") + '">' + (meIn ? "Edit my numbers" : "Add my numbers") + '</a></div>');
      }
    }
  };
  function bindFor(){
    const sel = $("#forSel");
    if (sel) sel.onchange = () => { if (sel.value) setMe(gid, sel.value); key = ""; screen.update(); };
  }
}

function HistoryScreen(gid){
  let key = "", headerSet = false;
  const gHash = "#/" + encodeURIComponent(gid);
  const open = new Set();
  return {
    update(){
      if (!S.loaded) return;
      if (!S.group){ view.innerHTML = missingGroupHTML(gid); setBar(null); return; }
      if (!headerSet){ headerSet = true; setHeader({crumb: "‹ " + S.group.name, href: gHash, title: "History"}); setBar(null); }
      const d = derive();
      const k = JSON.stringify(d.finished.map(s => [s.id, s.finishedAt]));
      if (k === key) return; key = k;
      if (!d.finished.length){ view.innerHTML = '<p class="hint">No finished nights yet. Hit Finish at the end of a game to record it here.</p>'; return; }
      view.innerHTML = '<p class="hint" style="margin:0 2px 12px">All-time numbers are added up from these nights. Delete a night and everyone\'s totals update.</p>' +
        d.finished.map(s => {
          const res = recordedToResult(s);
          const nm = pid => ((s.result.players || {})[pid] || {}).name || "Unknown";
          const rows = res.rows.slice().sort((a, b) => b.net - a.net);
          return '<details class="night" data-sid="' + s.id + '"' + (open.has(s.id) ? " open" : "") + '><summary>' +
            '<span class="dot ' + VERDICT[res.status].cls + '"></span>' +
            '<div class="p-main"><div class="p-name" style="font-size:17px">' + fmtDate(s.finishedAt) + '</div>' +
            '<div class="p-sub">' + rows.length + ' players · ' + money(res.totalIn) + ' pot</div></div><span class="chev">&rsaquo;</span></summary>' +
            '<div class="night-body">' +
              rows.map(r => '<div class="hrow"><span>' + esc(r.name) + '</span><span class="mono ' + tone(r.net) + '">' + signed(r.net) + '</span></div>').join("") +
              verdictHTML(res) + payoutsHTML(res, nm, null, null) +
              '<div class="foot-acts"><button class="ghost danger" type="button" data-del="' + s.id + '">Delete this night</button></div>' +
            '</div></details>';
        }).join("");
      view.querySelectorAll("details.night").forEach(el => el.addEventListener("toggle", () => {
        el.open ? open.add(el.dataset.sid) : open.delete(el.dataset.sid);
      }));
      view.querySelectorAll("[data-del]").forEach(btn => btn.onclick = async () => {
        if (!confirm("Delete this night for everyone? It comes out of all-time numbers. This can't be undone.")) return;
        await run(() => S.store.deleteSession(gid, btn.dataset.del));
        toast("Night deleted");
      });
    }
  };
}

function missingGroupHTML(gid){
  setHeader({crumb: "Poker night", href: S.lockedGid ? null : "#/", title: "Settle Up"});
  return '<section class="card"><h3>No group called “' + esc(gid) + '”</h3><p>The link may be wrong, or the group was deleted.</p>' +
    (S.lockedGid ? '' : '<a class="ghost" href="#/">See all groups</a>') + '</section>';
}

/* ---- router ---- */
function parseRoute(){
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  if (!parts.length) return {name: "home"};
  const gid = parts[0];
  if (parts[1] === "p" && parts[2]) return {name: "entry", gid, pid: parts[2]};
  if (parts[1] === "table") return {name: "table", gid};
  if (parts[1] === "history") return {name: "history", gid};
  return {name: "group", gid};
}
function watchGroupData(gid){
  if (S.gid === gid) return;
  if (S.unsubGroup) S.unsubGroup();
  S.gid = gid; S.loaded = false; S.group = null; S.players = []; S.sessions = [];
  S.unsubGroup = S.store.watchGroup(gid, snap => {
    if (S.gid !== gid) return;
    S.group = snap.group; S.players = snap.players || []; S.sessions = snap.sessions || [];
    S.loaded = true; S.err = null; renderBanner();
    if (screen) screen.update();
  }, onDbError);
}
function route(){
  const r = parseRoute();
  if (r.name === "home" && S.lockedGid){ location.replace("#/" + encodeURIComponent(S.lockedGid)); return; }
  window.scrollTo(0, 0);
  if (r.name === "home"){
    if (S.unsubGroup){ S.unsubGroup(); S.unsubGroup = null; S.gid = null; }
    screen = HomeScreen();
    if (!S.unsubHome) S.unsubHome = S.store.watchGroups(list => { S.groups = list; S.err = null; renderBanner(); if (screen) screen.update(); }, onDbError);
    screen.update();
    return;
  }
  if (S.unsubHome){ S.unsubHome(); S.unsubHome = null; }
  if (S.gid !== r.gid || !S.loaded){ view.innerHTML = '<p class="loading">Loading…</p>'; setBar(null); }
  screen = r.name === "entry" ? EntryScreen(r.gid, r.pid)
         : r.name === "table" ? TableScreen(r.gid)
         : r.name === "history" ? HistoryScreen(r.gid)
         : GroupScreen(r.gid);
  watchGroupData(r.gid);
  screen.update();
}

/* ---- boot ---- */
(async function boot(){
  const qg = new URLSearchParams(location.search).get("g");
  if (qg){
    S.lockedGid = qg;
    if (parseRoute().name === "home") history.replaceState(null, "", location.pathname + location.search + "#/" + encodeURIComponent(qg));
  }
  try {
    S.store = await initStore();
  } catch (e){
    onDbError({message: "Couldn't load Firebase. Check your internet connection and the config at the top of the file. (" + ((e && e.message) || e) + ")"});
    view.innerHTML = "";
    return;
  }
  renderBanner();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
